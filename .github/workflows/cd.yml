
name:  MLOps CD Pipeline

on:
  workflow_dispatch:
    inputs:
      training_mode:
        description: "Training execution mode"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - full

permissions:
  contents: read

concurrency:
  group: mlops-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ml-pipeline:
    name: Run ML Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 180

    defaults:
      run:
        shell: bash

    steps:
      # 1. Retrieve repository source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install the project's Python version.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 3. Install project dependencies and S3 support.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "dvc[s3]==3.67.1"

      # 4. Restore versioned data and reference artifacts.
      - name: Pull DVC artifacts
        run: |
          dvc pull data/raw.dvc models/reference.dvc --verbose

          echo "=== Reference directory ==="
          ls -lah models/reference/

          echo "=== Reference model ==="
          test -f models/reference/best_model_pipeline.joblib

          echo "=== Reference metadata ==="
          test -f models/reference/best_model_metadata.json

      # 5. Run existing automated tests.
      - name: Run tests
        run: python -m pytest tests/ -q

      # 6. Generate all three preprocessing variants.
      - name: Run preprocessing
        run: python -m scripts.run_preprocessing

      # 7. Train candidate models without promoting them.
      - name: Train models
        env:
          TRAINING_MODE: ${{ inputs.training_mode }}
        run: |
          if [[ "$TRAINING_MODE" == "quick" ]]; then
            python -m src.models.train --quick
          else
            python -m src.models.train
          fi

      # 8. Generate reproducible synthetic drift.
      - name: Generate drift datasets
        run: python -m src.data.drift_generator

      # 9. Detect drift, preserving the alert exit code.
      - name: Monitor drift
        id: monitoring
        run: |
          set +e
          python -m src.data.monitoring
          status=$?
          set -e

          if [[ "$status" -eq 1 ]]; then
            echo "Critical drift detected (expected stress test)."
            echo "drift_alert=critical" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -eq 0 ]]; then
            echo "No critical drift detected."
            echo "drift_alert=none" >> "$GITHUB_OUTPUT"
          else
            echo "Monitoring execution failed."
            exit "$status"
          fi

      # 10. Evaluate the unchanged reference model.
      - name: Evaluate model robustness
        run: python -m src.models.robustness
      
      #10.5 Verify reference artifacts survived all preceding stages.
      - name: Verify reference model before robustness
        run: |
          echo "=== Reference directory ==="
          ls -lah models/reference/

          echo "=== Reference model ==="
          test -f models/reference/best_model_pipeline.joblib

          echo "=== Reference metadata ==="
          test -f models/reference/best_model_metadata.json

          echo "Reference artifacts verified."

      # 11. Generate a GitHub Actions run summary.
      - name: Write run summary
        if: always()
        env:
          TRAINING_MODE: ${{ inputs.training_mode }}
          DRIFT_ALERT: ${{ steps.monitoring.outputs.drift_alert }}
        run: |
          echo "## Sprint 17 — MLOps Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Training mode: $TRAINING_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Drift alert: ${DRIFT_ALERT:-not evaluated}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reference model promotion: disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      # 12. Preserve reports and candidate artifacts.
      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-pipeline-${{ github.run_id }}
          path: |
            reports/drift/
            reports/robustness/
            data/drift/drift_metadata.json
            models/runs/
          if-no-files-found: warn
          retention-days: 14
