
name: MLOps Pipeline Orchestration

on:
  workflow_dispatch:
    inputs:
      training_mode:
        description: "Training execution mode"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - full

permissions:
  contents: read

concurrency:
  group: mlops-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ml-pipeline:
    name: Run ML Pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    defaults:
      run:
        shell: bash

    steps:
      # 1. Retrieve repository source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Python.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 3. Install dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "dvc[s3]==3.67.1"

      # 4. Restore versioned data and reference model.
      - name: Pull DVC artifacts
        run: |
          dvc pull data/raw.dvc models/reference.dvc --verbose

      # 5. Verify required reference artifacts.
      - name: Verify reference model
        run: |
          echo "=== Reference directory ==="
          ls -lah models/reference/

          test -f models/reference/best_model_pipeline.joblib
          test -f models/reference/best_model_metadata.json

          echo "Reference artifacts verified."

      # 6. Execute the shared Python orchestrator.
      # DVC has already been restored, so --pull-dvc
      # is intentionally omitted.
      - name: Run MLOps Pipeline
        env:
          TRAINING_MODE: ${{ inputs.training_mode }}
        run: |
          python -m scripts.run_pipeline --"$TRAINING_MODE"

      # 7. Generate the GitHub Actions execution summary.
      - name: Write run summary
        if: always()
        env:
          TRAINING_MODE: ${{ inputs.training_mode }}
        run: |
          echo "## Sprint 17 — MLOps Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Training mode: $TRAINING_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Orchestration: scripts/run_pipeline.py" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pipeline result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reference model promotion: disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Drift results are available in the execution logs and uploaded reports." >> "$GITHUB_STEP_SUMMARY"

      # 8. Preserve generated reports and training artifacts.
      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-pipeline-${{ github.run_id }}
          path: |
            reports/drift/
            reports/robustness/
            data/drift/drift_metadata.json
            models/runs/
          if-no-files-found: warn
          retention-days: 14
